name: Validate shared contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_contract.py --manifest examples/manifest.jsonl --features examples/features.jsonl --predictions examples/predictions.jsonl --model examples/model_metadata.json
